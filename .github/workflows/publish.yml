name: Publish npm package
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in package.json (leave empty to use package.json)
        required: false
        default: ""
        type: string
      dry_run:
        description: Validate and inspect without uploading to npm
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-publish-accessibility-plugin-react
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_publish: ${{ steps.check_version.outputs.should_publish }}
      version: ${{ steps.check_version.outputs.version }}
      dry_run: ${{ steps.check_version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - id: check_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execSync } from 'node:child_process';
          import { readFileSync, appendFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const eventName = process.env.EVENT_NAME;
          const inputVersion = process.env.INPUT_VERSION?.trim();
          const inputDryRun = process.env.INPUT_DRY_RUN === 'true';

          const targetVersion = inputVersion || pkg.version;
          assert.match(targetVersion, /^\d+\.\d+\.\d+$/, `Invalid semver format: ${targetVersion}`);
          assert.equal(pkg.name, 'accessibility-plugin-react');
          assert.equal(pkg.license, 'ISC');
          assert.equal(pkg.publishConfig?.tag, 'latest');

          if (inputVersion) {
            assert.equal(pkg.version, inputVersion, `package.json version (${pkg.version}) does not match input version (${inputVersion})`);
          }

          let publishedVersions = [];
          try {
            const raw = execSync('npm view accessibility-plugin-react versions --json', { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
            const parsed = JSON.parse(raw);
            publishedVersions = Array.isArray(parsed) ? parsed : [parsed];
          } catch (err) {
            const stderr = err.stderr ? err.stderr.toString() : '';
            if (stderr.includes('E404') || err.status === 1) {
              console.log('No existing versions found on npm registry (or 404).');
              publishedVersions = [];
            } else {
              throw err;
            }
          }

          const isPublished = publishedVersions.includes(targetVersion);

          let releaseExists = false;
          try {
            execSync(`gh release view v${targetVersion}`, { stdio: ['ignore', 'pipe', 'pipe'] });
            releaseExists = true;
          } catch {
            releaseExists = false;
          }

          let ghPackageExists = false;
          try {
            const raw = execSync(`gh api /users/prabothcharith/packages/npm/accessibility-plugin-react/versions --jq '.[].name' 2>/dev/null`, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
            ghPackageExists = raw.split('\n').map(v => v.trim()).includes(targetVersion);
          } catch {
            ghPackageExists = false;
          }

          const isDryRun = eventName === 'workflow_dispatch' ? inputDryRun : false;

          let shouldPublish = false;
          if (isDryRun) {
            console.log(`Workflow dispatched in dry-run mode for version ${targetVersion}. Proceeding with validation.`);
            shouldPublish = true;
          } else if (isPublished && releaseExists && ghPackageExists) {
            console.log(`Version ${targetVersion} is already published on npm, GitHub Releases, and GitHub Packages. Skipping.`);
            shouldPublish = false;
          } else {
            console.log(`Version ${targetVersion} has pending npm publication, GitHub release, or GitHub package. Proceeding.`);
            shouldPublish = true;
          }

          const outputFile = process.env.GITHUB_OUTPUT;
          if (outputFile) {
            appendFileSync(outputFile, `should_publish=${shouldPublish}\n`);
            appendFileSync(outputFile, `version=${targetVersion}\n`);
            appendFileSync(outputFile, `dry_run=${isDryRun}\n`);
          }
          JS
  validate:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global npm@11.21.0
      - name: Verify release identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(process.env.EXPECTED_VERSION, /^\d+\.\d+\.\d+$/);
          assert.equal(pkg.name, 'accessibility-plugin-react');
          assert.equal(pkg.version, process.env.EXPECTED_VERSION);
          assert.equal(pkg.license, 'ISC');
          assert.equal(pkg.publishConfig.tag, 'latest');
          JS
      - run: npm ci
      - run: npm run validate
      - run: npm run format:check
      - run: npm audit --omit=dev
      - run: npm run test:consumers
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Preserve the tested archive
        run: |
          mkdir release
          cp .consumers/package.tgz release/accessibility-plugin-react.tgz
          sha512sum release/accessibility-plugin-react.tgz > release/SHA512SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
  publish:
    needs: [check, validate]
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      EXPECTED_VERSION: ${{ needs.check.outputs.version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: release/
      - run: sha512sum --check release/SHA512SUMS
      - name: Inspect publication
        if: ${{ needs.check.outputs.dry_run == 'true' }}
        run: npm publish ./release/accessibility-plugin-react.tgz --dry-run --tag latest --access public
      - name: Publish the tested archive with OIDC
        if: ${{ needs.check.outputs.dry_run != 'true' }}
        run: |
          if npm view "accessibility-plugin-react@$EXPECTED_VERSION" version --registry "https://registry.npmjs.org/" >/dev/null 2>&1; then
            echo "accessibility-plugin-react@$EXPECTED_VERSION is already published on npm. Skipping upload."
          else
            npm publish ./release/accessibility-plugin-react.tgz --tag latest --access public
          fi
      - name: Verify registry integrity and latest tag
        if: ${{ needs.check.outputs.dry_run != 'true' }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const view = (...args) => JSON.parse(execFileSync('npm', ['view', ...args, '--json'], { encoding: 'utf8' }));
          const wait = (milliseconds) => new Promise(resolve => setTimeout(resolve, milliseconds));
          const viewPublishedPackage = async () => {
            let lastError;
            const spec = `accessibility-plugin-react@${process.env.EXPECTED_VERSION}`;
            for (let attempt = 1; attempt <= 90; attempt += 1) {
              try {
                execFileSync('npm', ['pack', spec, '--dry-run', '--json'], { stdio: 'ignore' });
                return view(spec, 'name', 'version', 'license', 'dist.integrity');
              } catch (error) {
                lastError = error;
                if (attempt < 90) await wait(10000);
              }
            }
            throw lastError;
          };
          const pkg = await viewPublishedPackage();
          const integrity = 'sha512-' + createHash('sha512').update(readFileSync('release/accessibility-plugin-react.tgz')).digest('base64');
          assert.equal(pkg.name, 'accessibility-plugin-react');
          assert.equal(pkg.version, process.env.EXPECTED_VERSION);
          assert.equal(pkg.license, 'ISC');
          assert.equal(pkg['dist.integrity'], integrity);
          assert.equal(view('accessibility-plugin-react', 'dist-tags').latest, process.env.EXPECTED_VERSION);
          JS
      - run: npm ci
        if: ${{ needs.check.outputs.dry_run != 'true' }}
      - name: Verify clean registry React and Next consumers
        if: ${{ needs.check.outputs.dry_run != 'true' }}
        env:
          ARAP_CONSUMER_VERSION: ${{ needs.check.outputs.version }}
        run: node scripts/prepare-consumers.mjs
      - name: Build scoped GitHub Package archive
        if: ${{ needs.check.outputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf github-package release-ghp
          mkdir github-package release-ghp
          tar -xzf release/accessibility-plugin-react.tgz -C github-package --strip-components=1
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'github-package/package.json';
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          pkg.name = '@prabothcharith/accessibility-plugin-react';
          pkg.publishConfig = {
            registry: 'https://npm.pkg.github.com',
          };
          writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          JS
          (cd github-package && npm pack --pack-destination ../release-ghp)
      - name: Publish to GitHub Packages
        if: ${{ needs.check.outputs.dry_run != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "${NPM_CONFIG_USERCONFIG}"
            echo "@prabothcharith:registry=https://npm.pkg.github.com" >> "${NPM_CONFIG_USERCONFIG}"
          fi
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          echo "@prabothcharith:registry=https://npm.pkg.github.com" >> ~/.npmrc
          npm config set //npm.pkg.github.com/:_authToken "${NODE_AUTH_TOKEN}"
          npm config set @prabothcharith:registry "https://npm.pkg.github.com"
          archive="$(find release-ghp -maxdepth 1 -name '*.tgz' -print -quit)"
          if npm view "@prabothcharith/accessibility-plugin-react@$EXPECTED_VERSION" version --registry "https://npm.pkg.github.com" >/dev/null 2>&1; then
            echo "@prabothcharith/accessibility-plugin-react@$EXPECTED_VERSION is already published on GitHub Packages."
          else
            npm publish "./$archive" --registry "https://npm.pkg.github.com"
          fi
      - name: Create GitHub Release
        if: ${{ needs.check.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = process.env.EXPECTED_VERSION;
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const sectionRegex = new RegExp(`## ${version.replace(/\\./g, '\\\\.')}[^\\n]*\\n([\\s\\S]*?)(?=\\n## |$)`);
          const match = changelog.match(sectionRegex);
          const notes = match ? match[1].trim() : `Release v${version}`;
          writeFileSync('release-notes.md', notes + '\n');
          JS
          if gh release view "v$EXPECTED_VERSION" >/dev/null 2>&1; then
            echo "Release v$EXPECTED_VERSION already exists."
          else
            gh release create "v$EXPECTED_VERSION" \
              release/accessibility-plugin-react.tgz \
              --title "v$EXPECTED_VERSION" \
              --notes-file release-notes.md
          fi
